name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mv: mv2
            blocklist: blocklist
            args: "--mv=mv2"
            run-tests: true
          - mv: mv2
            blocklist: no-blocklist
            args: "--mv=mv2 --no-blocklist"
            run-tests: false
          - mv: mv3
            blocklist: blocklist
            args: "--mv=mv3"
            run-tests: true
          - mv: mv3
            blocklist: no-blocklist
            args: "--mv=mv3 --no-blocklist"
            run-tests: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install pnpm
        run: npm install --global pnpm@10.34.4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        if: matrix.mv == 'mv3' && matrix.blocklist == 'blocklist'
        run: pnpm run security:audit
      - name: Typecheck
        if: matrix.mv == 'mv3' && matrix.blocklist == 'blocklist'
        run: pnpm run typecheck
      - name: Clean workspace
        run: pnpm run clean
      - name: Build ${{ matrix.mv }} (${{ matrix.blocklist }})
        run: pnpm run build:variant -- ${{ matrix.args }}
      - name: Test
        if: matrix.run-tests == 'true'
        run: pnpm test

  amo-source-review:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install reviewer build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          npm install --global pnpm@10.34.4
      - name: Extract submitted source archive
        run: |
          mkdir -p "$RUNNER_TEMP/amo-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/amo-source"
      - name: Reproduce Firefox submission
        run: |
          cd "$RUNNER_TEMP/amo-source"
          node --version
          npm --version
          pnpm --version
          pnpm install --frozen-lockfile
          pnpm run build:mv2
          pnpm exec web-ext lint --source-dir dist/mv2

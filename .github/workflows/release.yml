name: "Release"

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.4"
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          npm install --global pnpm@12.16.1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm run security:audit
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build all variants
        run: pnpm run build:all-variants
      - name: Test
        run: pnpm test
      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/extension-mv2-chrome.zip
            dist/extension-mv2-firefox.xpi
            dist/extension-mv3-chrome.zip
            dist/extension-mv2-no-blocklist-chrome.zip
            dist/extension-mv2-no-blocklist-firefox.xpi
            dist/extension-mv3-no-blocklist-chrome.zip
